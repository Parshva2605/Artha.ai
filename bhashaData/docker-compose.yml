services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    volumes:
      - ./backend:/app/backend
      - ./datasets:/datasets
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATASETS_STORAGE_PATH=/datasets
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=sqlite:////datasets/bhashaData.db
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
    command: celery -A backend.workers.celery_app.celery_app worker --loglevel=info --pool=solo -Q dataset_generation,celery
    working_dir: /app
    volumes:
      - ./backend:/app/backend
      - ./datasets:/datasets
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATASETS_STORAGE_PATH=/datasets
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=sqlite:////datasets/bhashaData.db
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    command: npm run dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
